services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    volumes: []
    command: npx vite --host --port 3000

  backend:
    environment:
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
    volumes: []
    command: node server.js
